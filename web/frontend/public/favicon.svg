<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- White Circular Background -->
  <circle cx="32" cy="32" r="31" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Centered Orange Feather Artwork -->
  <g transform="translate(12, 10) scale(0.625)">
    <!-- Feather Shaft / Spine -->
    <path d="M 12 52 C 22 36 34 22 52 12" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Outer Vane / Barbs (Vibrant Orange Gradient) -->
    <defs>
      <linearGradient id="orangeFeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF7E27"/>
        <stop offset="50%" stop-color="#F97316"/>
        <stop offset="100%" stop-color="#EA580C"/>
      </linearGradient>
      <linearGradient id="innerEyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDBA74"/>
        <stop offset="100%" stop-color="#FB923C"/>
      </linearGradient>
    </defs>
    
    <!-- Main Feather Body -->
    <path d="M 12 52 C 14 38 22 26 36 16 C 44 10 52 8 52 8 C 52 8 48 16 40 26 C 28 40 18 48 12 52 Z" fill="url(#orangeFeatherGrad)"/>
    <path d="M 12 52 C 20 48 30 38 42 26 C 48 20 52 12 52 12 C 52 12 44 18 34 28 C 22 38 14 46 12 52 Z" fill="#FB923C" opacity="0.85"/>
    
    <!-- Feather Crown Eye / Details -->
    <ellipse cx="44" cy="14" rx="6" ry="4" fill="url(#innerEyeGrad)" transform="rotate(-35 44 14)"/>
    <circle cx="44" cy="14" r="2.5" fill="#C2410C"/>
    
    <!-- Fine Vane Cuts / Feather Barbs -->
    <path d="M 22 42 L 16 46 M 28 34 L 21 39 M 34 26 L 27 31 M 40 18 L 34 22" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>